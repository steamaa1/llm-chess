# 一体化 Cloudflare Worker：前端静态资源 + Hono API
# GitHub 连接 Workers 后，Cloudflare 自动执行 [build] command，
# 再由 Worker Assets 将 apps/web/dist 部署至同一 workers.dev 域名。

name = "llm-chess"
main = "apps/api/src/worker.ts"
compatibility_date = "2025-07-31"
compatibility_flags = ["nodejs_compat"]

[build]
command = "npm run build --workspace @llm-chess/web"

[assets]
directory = "apps/web/dist"
not_found_handling = "single-page-application"
