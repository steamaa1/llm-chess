name: Build Worker Bundle
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Build frontend (assets not used by bundle, but keeps wrangler happy)
        run: npm run build --workspace @llm-chess/web
      - name: Bundle worker into a single file
        run: npx wrangler deploy --dry-run --outdir dist-worker
      - name: Upload worker bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: worker-bundle
          path: dist-worker/
          if-no-files-found: error
